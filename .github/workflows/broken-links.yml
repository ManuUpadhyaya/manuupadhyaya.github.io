name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Expand generated publication links
        run: |
          sed -nE \
            -e 's|^[[:space:]]*arxiv[[:space:]]*=[[:space:]]*\{([^}]*)\},?[[:space:]]*$|https://arxiv.org/abs/\1|p' \
            -e 's|^[[:space:]]*doi[[:space:]]*=[[:space:]]*\{([^}]*)\},?[[:space:]]*$|https://doi.org/\1|p' \
            _bibliography/*.bib > .lychee-generated-publication-urls.txt

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.1.0
        with:
          fail: true
          lycheeVersion: v0.22.0
          # Skip non-site content and allow common 302 redirects.
          args: >-
            --user-agent curl/7.54
            --accept 200..=299,302
            --max-concurrency 32
            --max-retries 5
            --retry-wait-time 2
            --timeout 20
            --exclude-path README.md
            --exclude-path _pages/404.md
            --exclude-path ^_site/
            --exclude-path ^lighthouse_results/
            --exclude 'https://www.control.lth.se/idp/.*'
            --exclude 'https://img.shields.io/.*'
            --exclude '^https://europt2024\.event\.lu\.se/?$'
            --root-dir .
            --verbose
            --no-progress
            './**/*.md'
            './**/*.html'
            './**/*.bib'
            './_data/**/*.yml'
            './.lychee-generated-publication-urls.txt'
