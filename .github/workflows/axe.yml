name: Axe accessibility testing

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**.rb"
      - "**.scss"
      - "**/*.md"
      - "**.yml"
      - "favicon.ico"
      - "Gemfile"
      - "Gemfile.lock"
      - "requirements.txt"
      - "robots.txt"
      - "site.webmanifest"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**.rb"
      - "**.scss"
      - "**/*.md"
      - "**.yml"
      - "favicon.ico"
      - "Gemfile"
      - "Gemfile.lock"
      - "requirements.txt"
      - "robots.txt"
      - "site.webmanifest"
      - "!lighthouse_results/**"
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

env:
  URL: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Cache Jekyll metadata 🧱
        uses: actions/cache@v4
        with:
          path: |
            .jekyll-cache
            .sass-cache
          key: jekyll-${{ runner.os }}-${{ hashFiles('Gemfile.lock', '_config.yml', '_sass/**', 'assets/css/**') }}
          restore-keys: |
            jekyll-${{ runner.os }}-
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
          fi
          if ! python3 -c "import nbconvert" >/dev/null 2>&1; then
            python3 -m pip install --upgrade -r requirements.txt
          fi
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npx --yes purgecss@latest -c purgecss.config.js
      - name: Install Axe and matching ChromeDriver 🚗
        run: |
          CHROME_VERSION="$(google-chrome --version | sed -E 's/.* ([0-9]+)\..*/\1/')"
          echo "Chrome version: $CHROME_VERSION"
          npm install -g "chromedriver@$CHROME_VERSION" @axe-core/cli http-server
      - name: Run axe 🪓
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        run: |
          http-server _site/ &
          axe --chromedriver-path "$(npm root -g)/chromedriver/bin/chromedriver" --chrome-options="--no-sandbox --disable-dev-shm-usage" --disable=link-in-text-block "http://localhost:8080/${{ github.event.inputs.url || env.URL }}" --load-delay=1500 --exit
