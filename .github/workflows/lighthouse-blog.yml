name: Blog Lighthouse preview

on:
  pull_request:
    branches: [master, main]
    paths:
      - "assets/**"
      - "_bibliography/**"
      - "_includes/**"
      - "_layouts/**"
      - "_pages/**"
      - "_plugins/**"
      - "_posts/**"
      - "_sass/**"
      - "_scripts/**"
      - "scripts/**"
      - "llms.txt"
      - "tests/**"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "requirements.txt"
      - "purgecss.config.js"
      - ".github/scripts/**"
      - ".github/workflows/lighthouse-blog.yml"
  push:
    branches: [master, main]
    paths:
      - "assets/**"
      - "_bibliography/**"
      - "_includes/**"
      - "_layouts/**"
      - "_pages/**"
      - "_plugins/**"
      - "_posts/**"
      - "_sass/**"
      - "_scripts/**"
      - "scripts/**"
      - "llms.txt"
      - "tests/**"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "requirements.txt"
      - "purgecss.config.js"
      - ".github/scripts/**"
      - ".github/workflows/lighthouse-blog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test blog behavior and MathJax rendering
        run: |
          npm install --prefix "$RUNNER_TEMP/mathjax-check" --no-save @mathjax/src@4.1.3
          MATHJAX_SOURCE_DIR="$RUNNER_TEMP/mathjax-check/node_modules/@mathjax/src" node --test tests/*.test.mjs
          bundle exec ruby tests/cache-bust.test.rb
          bundle exec ruby tests/terser-cache.test.rb
          bundle exec ruby tests/llms-txt.test.rb
          bundle exec ruby tests/blog-citation-metadata.test.rb
          bundle exec ruby tests/blog-citation-format.test.rb
          bundle exec ruby tests/roboto-local-fonts.test.rb
          bundle exec ruby tests/figure-cache-key.test.rb
      - name: Test compressed preview server
        run: python3 -m unittest discover -s .github/scripts -p 'test_serve_lighthouse.py'
      - name: Test production CSS typography preservation
        run: node --test .github/scripts/purgecss-mathjax.test.mjs
      - name: Build isolated production preview including unpublished posts
        env:
          JEKYLL_ENV: production
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
          fi
          if ! python3 -c "import nbconvert" >/dev/null 2>&1; then
            python3 -m pip install --upgrade -r requirements.txt
          fi
          bundle exec jekyll build --unpublished
          npx --yes purgecss@latest -c purgecss.config.js
      - name: Install Lighthouse
        run: npm install --global lighthouse@13.5.0
      - name: Audit blog index and article on mobile and desktop
        run: |
          python3 .github/scripts/serve-lighthouse.py --port 8080 --directory _site > "$RUNNER_TEMP/blog-preview-server.log" 2>&1 &
          PREVIEW_SERVER_PID=$!
          trap 'kill "$PREVIEW_SERVER_PID"' EXIT
          curl --silent --fail --retry 30 --retry-connrefused --retry-delay 1 --retry-max-time 30 http://127.0.0.1:8080/blog/ > /dev/null
          node .github/scripts/lighthouse-blog.mjs
          # Only aggregate scores enter the job summary. The draft site and raw
          # reports stay on this runner; this workflow has no deployment/upload.
